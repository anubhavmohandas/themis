[project]
name = "themis"
version = "1.0.0"
description = "Provenance-aware auditing of public Bitcoin attribution labels"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# the API tests import fastapi and post multipart forms, so `test` carries the
# `ui` packages too - `pip install -e ".[test]"` must be enough to run the suite
test = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
themis = "themis.cli:main"
themis-web = "themis.api:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["themis", "themis.trust", "themis.tasks", "themis.chains", "themis.ingest"]

[tool.setuptools.package-data]
themis = ["config/*.yml", "config/sources/*.yml"]

[tool.pytest.ini_options]
# collect only tests/: a bare `python -m pytest` must not wander into release/ (a
# copy of tests/ with the same module names), frontend/node_modules or external_data/
testpaths = ["tests"]
