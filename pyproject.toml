[project]
name = "themis"
version = "1.0.0"
description = "Provenance-aware auditing of public Bitcoin attribution labels"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.scripts]
themis = "themis.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["themis", "themis.trust", "themis.tasks", "themis.chains", "themis.ingest"]

[tool.setuptools.package-data]
themis = ["config/*.yml", "config/sources/*.yml"]
