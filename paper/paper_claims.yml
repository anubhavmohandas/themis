# THEMIS paper manifest: the values the manuscript DECLARES.
#
# This is a verification specification, not analysis input. Nothing in themis/
# reads it except `themis verify-paper` (themis/paper/verify.py), which compares
# it with what THEMIS generated (PaperMetrics) and with the text of the final PDF.
# The flow is one-way: analysis -> generated value; this file -> declared value;
# verifier -> comparison. It is never fed back into an analysis function.
#
# `expected` is the value AS THE PAPER STATES IT. `comparison` says how the paper
# rounds it; there is no implicit tolerance:
#   exact_integer     the generated number, rounded half-up to a whole number, equals expected
#   exact_string      str() equality (booleans, labels)
#   rounded_percent   generated*100 rounded half-up to `decimals` == expected*100 (expected is a fraction)
#   rounded_decimal   generated*`scale` rounded half-up to `decimals` == expected
#   approximate_text  as rounded_decimal, for wording such as "roughly 1.5 million"
#   range             min <= generated <= max
# `pdf` locates the same number in the final PDF (a table row + column, or a phrase
# containing {v}, which is replaced by expected rendered the way the paper prints it),
# so a manifest edited without the PDF (or the PDF without the manifest) fails.
# `class` (HEADLINE_STABLE ... DIAGNOSTIC) decides, through `policy`, what a
# failure does to the overall verdict. `id@suffix` reuses one metric under a second rule.

paper:
  file: ICISHCT2026_THEMIS_Repaired_Final.pdf
  sha256: 31b6f33e5dcd32266729d749789ea5d86579393f5b335779d7cfc91e5c7232ee
  title: 'Provenance Before Precision: Auditing Public Bitcoin Attribution Labels and Their Effect on Forensic Conclusions'
  version: repaired_final
policy:
  HEADLINE_STABLE:
    on_fail: fail
    on_not_reproduced: block
  SUPPORTING_STABLE:
    on_fail: fail
    on_not_reproduced: block
  LIMITATION:
    on_fail: fail
    on_not_reproduced: block
  DIAGNOSTIC:
    on_fail: ignore
    on_not_reproduced: ignore
  SENSITIVITY:
    on_fail: ignore
    on_not_reproduced: ignore
required:
- corpus.sources
- corpus.claims
- corpus.provenance_roots
- corpus.identified_roots
- corpus.unresolved_roots
- coverage.single_dataset_share
- coverage.multi_dataset_addresses
- coverage.elliptic_max_overlap_share
- circularity.rodwald_ransomwhere_shared
- circularity.rodwald_ransomwhere_shared@abstract
- circularity.rodwald_ransomwhere_share_of_rodwald
- circularity.rodwald_ransomwhere_share_of_ransomwhere
- circularity.montreal_seed
- circularity.montreal_ransomwhere
- circularity.montreal_tagpack
- circularity.montreal_rodwald
- circularity.montreal_range@low
- circularity.montreal_range@high
- drift.A.revenue
- drift.B.revenue
- drift.C.revenue
- drift.D.revenue
- drift.D.coverage_vs_B
- drift.B.revenue@abstract
- drift.D.revenue@abstract
- drift.D.coverage@abstract
- drift.spread_B_over_D
- unresolved_provenance.addresses
- unresolved_provenance.share
- rq1.taxonomy_rules
