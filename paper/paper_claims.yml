    - fig1b_data.csv
  unresolved_provenance:
    title: Unresolved provenance
    section: '5.4'
    function: themis.corpus.Corpus.corpus_roots
    artifacts:
    - unresolved_provenance.json
  anchors:
    title: Anchor validation
    section: '4.3'
    function: themis.analysis.anchor_validation
    artifacts:
    - anchors.json
  drift:
    title: Conclusion drift
    section: '5.3'
    function: themis.analysis.drift
    artifacts:
    - table2.json
    - table2.csv
    - fig2_data.csv
  condition_d:
    title: Condition D trace
    section: '5.3'
    function: themis.paper.experiments.condition_d_trace
    artifacts:
    - condition_d_trace.json
  agreement_diagnostics:
    title: Agreement (taxonomy-sensitive diagnostic)
    section: '5.1'
    function: themis.analysis.agreement
    artifacts:
    - diagnostics.json
  bootstrap:
    title: Provenance-bound uncertainty
    section: '5.4'
    function: themis.analysis.bootstrap
    artifacts:
    - bootstrap_lower.json
    - bootstrap_upper.json
