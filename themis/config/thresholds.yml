# Every numeric knob the analysis engine uses, gathered in one place so a
# value can be checked or overridden without touching analysis code.

# STEP 13 - a claim with no revision date is CURRENCY_UNKNOWN, never stale.
# A claim with a date older than this many years is STALE.
staleness_years: 3.0

# STEP 8 - a provenance-field value group smaller than this cannot establish
# containment either way; it is reported as `insufficient`, not judged.
min_containment_group: 5

# STEP 8A - containment share above which a group is called `inherited`, and
# below which it is called `independent`. Between the two: `mixed`.
containment_inherited_share: 0.999
containment_independent_share: 0.001

# STEP 15 - cluster bootstrap over provenance roots, not rows.
bootstrap:
  iterations: 2000
  seed: 42
  confidence_level: 0.95

# Anchor validation (Sec 4.3/4.7) - a source's agreement with the open anchor
# set is only estimable when its evaluated decisions come from at least this
# many independent RESOLVED provenance roots. The interval is a root-cluster
# bootstrap, and resampling one cluster (or none) has no between-root
# variance to draw on; 2 is the structural minimum, not a tuned accuracy bar.
# The reported root count and largest-root share, not this floor, are what a
# reader should use to judge how much a source's figure can bear.
anchor_min_independent_roots: 2

# STEP 11 - a pair's kappa is only surfaced as "substantial agreement" above
# this value; the raw figure and undefined/zero pairs are still reported.
kappa_substantial_threshold: 0.4

# A "type:entity"-shaped raw label (e.g. watchyourback's
# "onlinewallet:flexcoin") whose whole string doesn't already match a
# taxonomy alias gets its prefix tried against the taxonomy too, split on
# whichever of these appears first - never a guess, only fires when the
# prefix itself is a known alias. See taxonomy.split_structured_label.
structured_label_separators: [":"]

# STEP 8B - how many of a source's largest provenance-field value groups get
# shown in the console report.
decode_report_limit: 12

# how many of the corpus's most concentrated provenance roots to surface.
root_concentration_limit: 8
