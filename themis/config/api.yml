# Local API surface (themis/api.py). Nothing here changes a scientific result;
# it bounds what a request may ask of the process. Kept out of thresholds.yml
# on purpose: that file's hash is recorded by every paper-reproduction run.
#
# THREAT MODEL. THEMIS is a local, single-user tool: the API binds 127.0.0.1
# and has no authentication. The realistic attacker is an arbitrary web page
# open in the same browser, which can address http://127.0.0.1:<port>. This file
# closes the two browser-mediated paths that need no credentials:
#   * READ:  a foreign page cannot read a response, because CORS grants access
#            only to the origins below (never "*").
#   * WRITE: a foreign page can still fire a "simple" cross-origin POST blind
#            (multipart upload); the API refuses any state-changing request
#            whose Origin header is present and not in this list.
# NOT covered (would need Host-header validation or auth): DNS rebinding, and
# any other local process. Requests with no Origin header (curl, scripts,
# tests) are not browser requests and are unaffected.

cors:
  # exactly the origins the bundled frontend is served from: the Vite dev
  # server (5173) and `vite preview` (4173), by both spellings of loopback
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - http://127.0.0.1:4173

upload:
  # Largest uploaded file THEMIS will accept, in bytes, enforced while the
  # request body is read (never trusted from Content-Length). For a .gz upload
  # the same figure also bounds the DECOMPRESSED size, so a small archive
  # cannot expand into an unbounded in-memory table. 256 MiB.
  max_bytes: 268435456
  # Allowance, on top of max_bytes, for the multipart framing and form fields
  # that travel in the same body as the file. Only bounds what is read off the
  # wire; the file itself is checked against max_bytes exactly. 1 MiB.
  multipart_overhead_bytes: 1048576

paging:
  claims_max_page: 500        # rows per /claims page, however large `limit` asks for
  conflicts_max_page: 200     # rows per /conflicts page
  extract_preview_claims: 500 # claims echoed in an upload/extract response (the rest are paged)
