# Canonical category tree. Every node has a polarity and an optional parent;
# `classify_address` walks these parent links generically, so a new leaf
# category needs no code change - only an entry here.
#
# `illicit_unspec` / `licit_unspec` are the generic root of each polarity
# branch: a claim landing there is "some kind of illicit/licit entity, kind
# unspecified", which is why pairing it with any specific descendant reads as
# a refinement rather than a conflict.
categories:
  unknown:
    polarity: unknown

  illicit_unspec:
    polarity: illicit
    # class_1: the Elliptic/Elliptic++ dataset's own published class code for
    # "illicit" (Weber et al.; confirmed 2026-09-18 against the dataset's
    # actual documentation - class-1=illicit, class-2=licit, class-3=unknown
    # is the dataset's own declared scheme, not an inference). Confirmed via
    # Corpus.demo() + analysis.agreement() that adding this alias does not
    # change a single bundled-corpus number: the paper snapshot's `canon`
    # values are pre-baked into demo_data/observations_sample.csv.gz at
    # data-preparation time, not recomputed from this file on load - this
    # only takes effect for a *newly ingested* Elliptic-shaped upload
    # (STEP 23), never retroactively for the frozen paper corpus. See
    # HARDENING_LOG.md "Elliptic++'s class_1/class_2..." for the full
    # before/after check and why the bundled numbers are untouched.
    aliases: [illicit, illicit-unspecified, illicit_unknown, class_1]

  licit_unspec:
    polarity: licit
    # class_2: see illicit_unspec's class_1 comment above - same source,
    # same verification, same "paper corpus is unaffected" guarantee.
    aliases: [licit, licit-unspecified, licit_unknown, class_2]

  ransomware:
    polarity: illicit
    parent: illicit_unspec
    aliases: [ransom, ransomware payment, ransomware-wallet, ransomware_payment]

  mixer:
    polarity: illicit
    parent: illicit_unspec
    aliases: [mixing service, tumbler, mixing_service]

  darknet_market:
    polarity: illicit
    parent: illicit_unspec
    aliases: [darknet, dnm, darknet-market, darknet market]

  ponzi:
    polarity: illicit
    parent: illicit_unspec
    aliases: [ponzi scheme, ponzi_scheme]

  scam:
    polarity: illicit
    parent: illicit_unspec
    aliases: [fraud]

  sextortion:
    polarity: illicit
    parent: illicit_unspec

  malware:
    polarity: illicit
    parent: illicit_unspec

  extremism:
    polarity: illicit
    parent: illicit_unspec

  sanctioned:
    polarity: illicit
    parent: illicit_unspec
    aliases: [sanctions, ofac, sdn]

  hack:
    polarity: illicit
    parent: illicit_unspec
    aliases: [hacked, theft, stolen_funds]

  terrorism:
    polarity: illicit
    parent: illicit_unspec

  trafficking:
    polarity: illicit
    parent: illicit_unspec

  exchange:
    polarity: licit
    parent: licit_unspec
    aliases: [centralized exchange, cex, trading platform, trading_platform]

  mining:
    polarity: licit
    parent: licit_unspec
    aliases: [mining pool, mining_pool]

  gambling:
    polarity: licit
    parent: licit_unspec
    aliases: [casino]

  faucet:
    polarity: licit
    parent: licit_unspec

  bridge:
    polarity: licit
    parent: licit_unspec

  payment_proc:
    polarity: licit
    parent: licit_unspec
    aliases: [payment processor, payment_processor]

  wallet_service:
    polarity: licit
    parent: licit_unspec
    aliases: [hosted wallet, custodial_wallet]

  marketplace_legal:
    polarity: licit
    parent: licit_unspec
    aliases: [legal marketplace, marketplace]

  individual:
    polarity: licit
    parent: licit_unspec
    aliases: [person, personal_wallet]
