# STEP 20/21 - label-trust policies as composable, reusable filters over
# claims. A policy names which predicates a claim must pass (see
# trust/predicates.py for what each predicate means) and how eligible
# claims get aggregated into one figure. Nothing here is task-specific:
# the same four policies apply to any task module that hands the engine a
# list of value-bearing claims.
#
# `baseline` is the policy every other policy's coverage/ratio is reported
# against - STEP 20 requires every forensic number to carry its coverage,
# and coverage needs a fixed point of comparison.
baseline: address_dedup

policies:
  naive_union:
    label: "naive union, sources summed as independent"
    aggregation: raw_sum
    eligibility: []

  address_dedup:
    label: "address-level deduplication"
    aggregation: dedup_max_per_address
    eligibility: []

  inheritance_collapsed:
    label: "circular inheritance collapsed to its root"
    aggregation: dedup_max_per_address
    eligibility: [root_independent_or_native]

  verified_only:
    label: "highest-declared-confidence tier only"
    aggregation: dedup_max_per_address
    eligibility: [anchor_membership]
    # What the externally-assembled anchor set is declared to consist of, in
    # each source's OWN vocabulary. This does not drive eligibility (the anchor
    # set does); the Condition D trace reads it to check, address by address,
    # that the retained addresses really carry such a claim in the corpus.
    # These are declarations by the sources, not THEMIS evidence tiers, and are
    # not re-verified here (see confidence_semantics in config/sources/tagpack.yml).
    declared_confidence_criteria:
      - source: tagpack
        field: subcat
        equals: forensic
        meaning: "GraphSense tag declared confidence id `forensic` (a creator's declaration about a report)"
      - source: watchyourback
        field: canon
        equals: ransomware
        meaning: "WatchYourBack manually annotated ransomware address (evidence not re-checkable here)"
