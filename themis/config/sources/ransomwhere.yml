id: ransomwhere
display_name: "Ransomwhere"
chain: bitcoin
citation: "Ransomwhere crowd-sourced ransomware tracker (ransomwhe.re; Zenodo DOI 10.5281/zenodo.6512122)"
license: "CC BY - confirmed 2026-09-18 via the dataset's Zenodo record; redistribution/derivatives permitted with attribution."
confidence_semantics: >
  Crowd report - unverified per the paper's evidence taxonomy. Confirmed
  2026-09-18 against Ransomwhere's own published methodology: a submitter
  must supply the Bitcoin address, the ransomware family, and evidence of
  the ransom demand (e.g. a screenshot of the payment portal or an
  infection message), and Ransomwhere's maintainers manually review every
  report before publishing it (addresses are held private for 90 days
  after submission). This is real editorial moderation - stronger than an
  anonymous, unmoderated crowd feed - but it is the *platform's own*
  review, not independent verification by a third party or by THEMIS, and
  the evidence itself (a screenshot) establishes that a ransom was
  demanded at that address, not that THEMIS can independently re-check the
  incident. `UNVERIFIED_REPORT` remains the correct, conservative tier for
  this reason, not because the source is unmoderated.
known_dependencies: []

# Ransomwhere is itself the origin of its addresses (crowd-submitted, not
# copied from elsewhere as far as this pipeline can establish), so every
# claim resolves to one native root. That the root is *known* does not make
# the evidence *verified* - a crowd report stays UNVERIFIED_REPORT tier
# regardless of how cleanly its provenance resolves; see `heuristic` per
# claim for the tier, which is orthogonal to this root assignment.
provenance:
  mode: fixed_root
  root: ransomwhere_crowd
  resolved: true
  native: true
  verified: false
