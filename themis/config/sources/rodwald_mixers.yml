id: rodwald_mixers
display_name: "Rodwald mixer corpus"
chain: bitcoin
citation: "Rodwald, \"Preparing a Dataset of Mixers BTC Addresses for Machine Learning Purpose\" (Springer, 978-3-031-92734-8_19)"
license: >
  UNCONFIRMED - checked 2026-09-18: the paper is paywalled (Springer),
  preventing access to any data-availability statement; the author's own
  data-hosting site (sydeus.rodwald.pl) shows a terms link but no license
  text was retrievable. Same "flag, don't act" treatment as Elliptic++ - see
  HARDENING_LOG.md.
confidence_semantics: "compiled from multiple named inputs, encoded as source letters"
known_dependencies: [walletexplorer]

provenance:
  mode: contains_rules
  field: prov_family
  parse: after_colon
  parse_default: ""
  contains_rules:
    - contains: "W"
      root: walletexplorer
      resolved: true
      native: false
  # Rodwald's own direct mixer classification (not decoded from WalletExplorer).
  # Unlike rodwald_ransom's own-bucket, this is treated as an identified root:
  # the letter code fully explains every claim that lands here, so nothing is
  # left ambiguous - only the ransom corpus's undecoded remainder is unresolved.
  fallback_template: "rodwald_mixers_own"
  fallback_resolved: true
  fallback_native: true
