id: ellipticpp
display_name: "Elliptic++"
chain: bitcoin
citation: "Elmougy & Liu, \"Elliptic++: A Graph Network of Bitcoin Blockchain Transactions and Wallet Addresses\" (arXiv:2306.06108); dataset at github.com/git-disl/EllipticPlusPlus"
license: >
  UNCONFIRMED - checked 2026-09-18: the dataset's own GitHub repo
  (git-disl/EllipticPlusPlus) states no explicit license, only a citation
  request; the underlying original Elliptic transaction dataset it extends
  is separately published under CC BY-NC-ND 4.0 (non-commercial, no
  derivatives) elsewhere, but that is not confirmed to also govern
  Elliptic++'s own wallet-address data. That matters because this
  repo's bundled demo_data/observations_sample.csv.gz is a git-tracked,
  normalized derivative of this data in what is currently a public repo.
  Flagged for the authors to verify directly with the dataset's authors -
  not resolved by this pass.
confidence_semantics: >
  Heuristic-derived; methodology not publicly disclosed per-label - true
  for the *provenance* (how each address was linked to its class), which
  is why the root stays `elliptic_undisclosed`/unresolved below. The
  *class codes themselves* are documented, though: this source's raw
  labels are exactly `class_1`/`class_2`/`class_3`, matching Elliptic's own
  published scheme (Weber et al.) of illicit/licit/unknown - confirmed
  2026-09-18 and mapped in taxonomy.yml's `illicit_unspec`/`licit_unspec`
  aliases (class_3 correctly stays unmapped: it's the source's own declared
  "unknown", not an inference).
known_dependencies: []

# The publisher does not disclose per-label methodology, so every claim from
# this source terminates in the same undisclosed root. This is a fixed root,
# not "the dataset name is the root" - `elliptic_undisclosed` marks it
# unresolved rather than pretending the dataset's own identity is evidence.
provenance:
  mode: fixed_root
  root: elliptic_undisclosed
  resolved: false
  native: true
  verified: false
