id: watchyourback
display_name: "WatchYourBack"
chain: bitcoin
citation: "\"Watch Your Back: Identifying Cybercrime Financial Relationships in Bitcoin through Back-and-Forth Exploration\" (CCS'22); github.com/cybersec-code/watchyourback"
license: >
  GPL-3.0 (confirmed 2026-09-18, the tool repository's own LICENCE file) -
  governs the analysis code; whether it also extends to the address/tag
  data specifically is not separately confirmed. Lower individual risk
  than the other sources here (309 of 1,497,191 corpus addresses, 0.02%),
  but GPL-3.0 is copyleft (derivative works must also be GPL-3.0), and this
  repo currently has no LICENSE file of its own - a separate, smaller
  finding worth the author's attention alongside the Elliptic++ one. See
  HARDENING_LOG.md.
confidence_semantics: >
  Curated, cited annotation: EVERY record in upstream's data/tagging/
  btc_resolv.csv (309 of 309, re-checked 2026-09-19) carries an external
  reference URL, so the dataset is not itself a provenance root - what each
  record's citation points to varies, and a claim's root is resolved per
  record below, not per dataset. Declared "manually verified" is a claim
  about WatchYourBack's process, not the paper's verified tier (Sec 4.2:
  its annotations are open anchors that do not themselves reach that tier)
  - so its own records are tiered DERIVED, and only a record whose root
  terminates in re-checkable evidence is VERIFIED.
  Per-record citation analysis (results/final_freeze/analysis/wyb_provenance_*):
  71 of the 87 records upstream marks with a leading "#" - all entity
  "hydra-market" - cite Treasury's OFAC recent-actions page (20220405), every
  one of those addresses is in OFAC's current SDN list, and the SDN entity is
  "Hydra Market" for all 71. That is RESOLVED_TO_OFAC and is mapped below to
  root ofac_sdn (non-native: WatchYourBack restates OFAC's designation, so it
  can no longer confirm an OFAC-rooted anchor or Schnoering's own OFAC
  claims as independent). The other 16 "#" records are NOT reassigned:
  14 (entity apt29) cite a news article about an OFAC action and their
  addresses are in the SDN list, but the SDN entities (Secondeye Solution,
  RAZA Mujtaba Ali, SOUTHFRONT) are not "apt29" - the designation is OFAC's,
  the attribution is not shown to be; 2 (mrpr0gr4mmer) cite a threat-intel
  blog and a Telegram channel mirror. Those 16 stay under
  watchyourback_manual, where they are still credited as WatchYourBack's own
  finding - AUTHOR DECISION: an unresolved root for them would change the
  paper's root inventory (25 roots / 21 identified / 4 unresolved).
  The same Treasury-citation pattern also holds for 31 non-"#" records
  (20 lazarus, 11 drug-trafficking), and 171 non-"#" records cite other
  external sites; none is reassigned because the bundled observation schema
  carries no per-record reference URL, and `lazarus` mixes OFAC and non-OFAC
  citations so an entity-keyed rule cannot separate them.
known_dependencies: []

address_normalization:
  strip_prefix: "#"
  reason: >
    87 of 309 rows in upstream's own data/tagging/btc_resolv.csv (the same
    87 as confidence_semantics above) carry a leading "#" on the address
    field itself - confirmed 2026-09-18 as an exact 87/87 match against
    that live upstream file, so this is WatchYourBack's own convention,
    not a THEMIS artifact. Left unstripped it silently broke cross-source
    address matching for 72 of the 87 (82.8%) that already exist elsewhere
    in the corpus under schnoering/tagpack. The raw value is preserved on
    every claim as raw_address; only the working `address` field (used for
    cross-source joining) is normalized. This does not change which
    provenance root these claims resolve to - see confidence_semantics.

# Per-record, not per-dataset: keyed on `subcat` (the entity, e.g. hydra-market).
# `hydra-market` never appears on a record that is not OFAC-cited (checked
# against the full upstream file), so the key isolates exactly the records the
# analysis above resolved. Every other record keeps the source's own root.
provenance:
  mode: field_map
  field: subcat
  map:
    hydra-market: {root: ofac_sdn, resolved: true, native: false, verified: true}
  default: {root: watchyourback_manual, resolved: true, native: true, verified: false, declared: true}
