id: watchyourback
display_name: "WatchYourBack"
chain: bitcoin
citation: "\"Watch Your Back: Identifying Cybercrime Financial Relationships in Bitcoin through Back-and-Forth Exploration\" (CCS'22); github.com/cybersec-code/watchyourback"
license: >
  GPL-3.0 (confirmed 2026-09-18, the tool repository's own LICENCE file) -
  governs the analysis code; whether it also extends to the address/tag
  data specifically is not separately confirmed. Lower individual risk
  than the other sources here (309 of 1,497,191 corpus addresses, 0.02%),
  but GPL-3.0 is copyleft (derivative works must also be GPL-3.0), and this
  repo currently has no LICENSE file of its own - a separate, smaller
  finding worth the author's attention alongside the Elliptic++ one. See
  HARDENING_LOG.md.
confidence_semantics: >
  Manually verified per source declaration - accurate for most of this
  source's claims. But 87 of 309 (28.2%, checked 2026-09-18 against
  github.com/cybersec-code/watchyourback's real current data/tagging/
  btc_resolv.csv - an exact 87/87 match, so this is upstream's own data,
  not a THEMIS artifact) are marked with a leading "#" in that file and
  cite a source external to WatchYourBack's own graph-exploration
  methodology (US Treasury OFAC sanctions pages, a threat-intel blog, a
  Telegram channel) rather than WatchYourBack's own research, which every
  non-"#" line does. The convention is undocumented upstream (no README
  mention, an uninformative single git commit), but this is strong
  circumstantial evidence these 87 are a bolted-on reference batch, not
  WatchYourBack's own verified output - "manually verified per source
  declaration" likely credits the wrong methodology for them specifically.
  Also: THEMIS currently ingests the literal "#" as part of the address
  string for these 87, breaking cross-source address matching for them.
  Neither issue is fixed here - see HARDENING_LOG.md "WatchYourBack's
  #-prefixed addresses..." for full detail and recommendations.
known_dependencies: []

