id: tagpack
display_name: "GraphSense TagPack"
chain: bitcoin
citation: "GraphSense TagPack collection"
license: "see publisher"
confidence_semantics: >
  Per-tagpack creator, declared not independently verified. GraphSense's own
  TagPack schema additionally declares a separate, optional per-tag
  "confidence" id (see confidence.csv in graphsense/graphsense-tagpack-tool,
  retrieved 2026-09-18) on a 5-100 reliability scale - e.g. "forensic"
  (level 50: "trusted reports, e.g. academic papers" - NOT the same id as
  "forensic_investigation", level 70) vs. "authority_data" (level 60, e.g.
  OFAC) vs. "web_crawl" (level 20). This raw id survives ingestion in each
  claim's `subcat` field but THEMIS currently assigns every tagpack claim
  the same flat "curated" heuristic/DERIVED tier regardless of it - see
  HARDENING_LOG.md "PAPER MAY NEED UPDATE - TagPack confidence flattening"
  for the observed distribution and why this was not silently changed.
known_dependencies: [montreal_paquet_clouston_2019]

# `prov_family` stores "tagpack:<creator>". Each declared creator is an
# identified (if not independently verified) root in its own right - the
# one exception is a creator string that itself names the Montreal 2019
# study, which is folded into that study's root rather than treated as a
# distinct TagPack-only root.
provenance:
  mode: substring_map
  field: prov_family
  parse: after_colon
  parse_default: "unknown"
  substring_map:
    - contains: "paquet-clouston"
      root: montreal_paquet_clouston_2019
      resolved: true
      native: false
  fallback_template: "tagpack_{value}"
  fallback_resolved: true
  fallback_native: true
