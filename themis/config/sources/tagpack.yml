id: tagpack
display_name: "GraphSense TagPack"
chain: bitcoin
citation: "GraphSense TagPack collection (github.com/graphsense/graphsense-tagpacks)"
license: "MIT (confirmed 2026-09-18 via the repository's own LICENSE file) - redistribution/derivatives permitted."
confidence_semantics: >
  Two different things share the word "confidence" here, and THEMIS keeps
  them apart. (1) GraphSense's own per-tag `confidence` id (see
  confidence.csv in graphsense/graphsense-tagpack-tool, retrieved
  2026-09-18): a tag creator's declared reliability class on a 5-100 scale -
  web_crawl 20, forensic 50 ("trusted reports, e.g. academic papers"),
  authority_data 60 (e.g. OFAC), forensic_investigation 70 (a different id
  from forensic) - which survives per claim, unmodified, in `subcat`. (2)
  THEMIS's evidence tier (verified / derived / unverified-report / unknown),
  which describes whether the evidence behind a claim can be re-checked by a
  third party. No GraphSense value is mapped onto a THEMIS tier: forensic is
  a creator's declaration about a report, not re-checkable evidence, and
  there is no defensible 1:1 mapping between the two vocabularies. Every
  tagpack claim is therefore tiered DERIVED (creator-declared, curated)
  whatever its id. FINAL DECISION (scientific freeze): SOURCE-NATIVE
  CONFIDENCE PRESERVED, NOT EQUATED WITH THE THEMIS VERIFICATION TIER; no
  confidence_normalized field exists.
  It is descriptive for every THEMIS statistic EXCEPT ONE, and that one is
  material: the paper's Condition D (`themis drift`, "highest declared
  confidence") is the revenue at addresses in demo_data/verified_anchors.txt.gz,
  an anchor set assembled outside THEMIS as TagPack tags whose confidence
  is `forensic` united with WatchYourBack's ransomware annotations. In the
  bundled sample every one of Condition D's 7,457 addresses carries a
  `forensic` TagPack tag (WatchYourBack alone would give 31 addresses); and
  at ransomware-revenue addresses no tag has a higher id (authority_data or
  forensic_investigation), so choosing a level above forensic would empty
  Condition D. "Highest declared confidence" is therefore accurate only
  among the ids actually present at those addresses, not on GraphSense's own
  scale, where forensic sits below authority_data and forensic_investigation.
  Observed distribution of the raw id over the bundled sample's 25,362
  tagpack claims: forensic 69.9%, service_data 27.3%, blank 1.6%,
  authority_data 0.7%, web_crawl 0.4%.
known_dependencies: [montreal_paquet_clouston_2019]

# `prov_family` stores "tagpack:<creator>". Each declared creator is an
# identified (if not independently verified) root in its own right - the
# one exception is a creator string that itself names the Montreal 2019
# study, which is folded into that study's root rather than treated as a
# distinct TagPack-only root.
provenance:
  mode: substring_map
  field: prov_family
  parse: after_colon
  parse_default: "unknown"
  substring_map:
    - contains: "paquet-clouston"
      root: montreal_paquet_clouston_2019
      resolved: true
      native: false
  fallback_template: "tagpack_{value}"
  fallback_resolved: true
  fallback_native: true
