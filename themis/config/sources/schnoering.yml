id: schnoering
display_name: "Schnoering et al. corpus"
chain: bitcoin
citation: "Schnoering & Vazirgiannis, Bitcoin research with a transaction graph dataset, Scientific Data 12, 404 (2025); labelled addresses = addresses.csv of figshare 10.6084/m9.figshare.26305093.v3 (BitcoinTemporalGraph). Not the 2026 Zenodo record 10.5281/zenodo.22239038, whose labels are per-transaction entity names with no category or source."
license: "CC BY 4.0 - figshare record metadata, checked 2026-09-20; redistribution/derivatives permitted with attribution."
confidence_semantics: "multi-input curation across named sub-corpora"
known_dependencies: [ofac_sdn, coinbase_messages, exchange_self_disclosure]

# The dataset's own `subcat` field already names its sub-corpus in plain
# text, so provenance here is a direct declared-field lookup - no decoding
# needed. SDN and Exchange terminate in independently re-checkable evidence
# (a sanctions list entry, an issuer's own disclosure), so those two are
# marked verified; the rest are named studies or crowd forums, not
# independently re-checkable by this pipeline.
provenance:
  mode: field_map
  field: subcat
  map:
    "Montréal":         {root: montreal_paquet_clouston_2019, resolved: true}
    "Padua":            {root: padua_conti_2018,               resolved: true}
    "PaduaSextorsion":  {root: padua_sextortion_2020,          resolved: true}
    "BitcoinTalk":      {root: bitcointalk_forum,               resolved: true}
    "SDN":              {root: ofac_sdn,                        resolved: true, verified: true}
    "CoinbaseMessages": {root: coinbase_messages,                resolved: true}
    "WBTC":             {root: wbtc_disclosure,                  resolved: true}
    "Exchange":         {root: exchange_self_disclosure,         resolved: true, verified: true}
  default: {root: schnoering_other, resolved: false}
